services:
  - type: web
    name: rag-pipeline
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      # The free plan has 512 MB of memory, too little for local models, so
      # answers come from Groq (free key at console.groq.com/keys) and search
      # is BM25 keyword search, because Groq has no embedding model.
      - key: GROQ_API_KEY
        sync: false
      - key: PROVIDER
        value: groq
